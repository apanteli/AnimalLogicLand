<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#bde8ff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="A gentle match-3 logic game for kids aged 5 to 8: find the secret animal rule!">
  <title>Animal Logic Land</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦉</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ============ LEVEL MAP ============ -->
    <section id="screen-map" class="screen">
      <header class="map-header">
        <h1 class="title" data-i18n="title">Animal Logic Land</h1>
        <div class="total-stars"><span class="star on">★</span><span id="total-stars">0</span></div>
      </header>

      <div class="map-scroll" id="map-scroll">
        <div class="map" id="map">
          <svg class="map-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
            <path id="map-road" class="road" d=""></path>
            <path id="map-dots" class="dots" d=""></path>
          </svg>
          <div class="map-deco" id="map-deco" aria-hidden="true"></div>
          <div id="map-nodes"></div>
        </div>
      </div>

      <footer class="map-footer">
        <button id="btn-account" class="round-btn account-btn hidden" data-i18n-aria="account">👤</button>
        <button id="btn-lang" class="round-btn lang-btn" data-i18n-aria="lang">EN</button>
        <button class="round-btn btn-mute" data-i18n-aria="mute">🔊</button>
      </footer>
    </section>

    <!-- ============ GAME ============ -->
    <section id="screen-game" class="screen hidden">
      <header class="game-bar">
        <button id="btn-home" class="round-btn" data-i18n-aria="home">🏠</button>
        <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progress-fill"></div>
          <span class="progress-goal" aria-hidden="true">⭐</span>
        </div>
        <button id="btn-bulb" class="round-btn bulb invisible" data-i18n-aria="whatsRule" disabled>💡</button>
      </header>

      <main class="board-wrap" id="board-wrap">
        <div class="board" id="board">
          <div class="board-grid" id="board-grid"></div>
        </div>
      </main>

      <footer class="game-footer">
        <div class="owl" id="owl" aria-hidden="true">🦉<span class="owl-bubble">👀</span></div>
        <button class="round-btn btn-mute" data-i18n-aria="mute">🔊</button>
      </footer>
    </section>

    <!-- ============ RULE GUESS POPUP ============ -->
    <div class="modal hidden" id="modal-guess" role="dialog" aria-modal="true" aria-labelledby="guess-title">
      <div class="modal-card">
        <button class="close-btn" id="btn-guess-close" data-i18n-aria="close">✖</button>
        <div class="modal-icon">💡</div>
        <h2 id="guess-title" data-i18n="whatsRule">What's the rule?</h2>
        <div class="choices" id="guess-choices"></div>
      </div>
    </div>

    <!-- ============ WIN POPUP ============ -->
    <div class="modal hidden" id="modal-win" role="dialog" aria-modal="true" aria-labelledby="win-title">
      <div class="modal-card">
        <div class="modal-icon win-burst" id="win-burst">🎉</div>
        <h2 id="win-title">Well done!</h2>
        <div class="win-stars" id="win-stars">
          <span class="big-star">★</span><span class="big-star">★</span><span class="big-star">★</span>
          <span class="bonus-star hidden" id="win-bonus">🌟</span>
        </div>
        <div class="rule-reveal">
          <div class="rule-label" data-i18n="ruleWas">The secret rule was:</div>
          <div class="rule-pic" id="win-rule-pic"></div>
          <div class="rule-text" id="win-rule-text"></div>
        </div>
        <div class="modal-actions">
          <button class="round-btn" id="btn-win-map" data-i18n-aria="home">🗺️</button>
          <button class="round-btn" id="btn-win-replay" data-i18n-aria="replay">🔁</button>
          <button class="round-btn primary" id="btn-win-next" data-i18n-aria="next">▶️</button>
        </div>
      </div>
    </div>

    <!-- ============ ACCOUNT POPUP (grown-ups, cloud saves) ============ -->
    <div class="modal hidden" id="modal-account" role="dialog" aria-modal="true" aria-labelledby="account-title">
      <div class="modal-card">
        <button class="close-btn" id="btn-account-close" data-i18n-aria="close">✖</button>
        <div class="modal-icon">☁️</div>
        <h2 id="account-title" data-i18n="grownUps">For grown-ups</h2>
        <div id="account-gate">
          <p class="account-text" id="gate-question"></p>
          <input id="gate-answer" class="gate-input" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="3" aria-labelledby="gate-question">
          <button class="pill-btn" id="btn-gate-ok" data-i18n="ok">OK</button>
        </div>
        <div id="account-panel" class="hidden">
          <p class="account-text" id="account-status"></p>
          <button class="pill-btn" id="btn-sign-in" data-i18n="signIn">Sign in with Google</button>
          <button class="pill-btn secondary" id="btn-sign-out" data-i18n="signOut">Sign out</button>
        </div>
      </div>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <div class="confetti" id="confetti" aria-hidden="true"></div>
  </div>

  <!-- Order matters: data first, then logic, then UI. -->
  <script src="js/animals.js"></script>
  <script src="js/levels.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/board.js"></script>
  <script src="js/game.js"></script>
  <script src="js/boardView.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
